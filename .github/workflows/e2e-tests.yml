name: JaSketch E2E Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # jaclang, jac-client, jac-scale and byllm are one binary now: there is
      # nothing to pip install, and no separate MCP package to build first.
      - name: Read the pinned jac version
        id: jac
        run: |
          VERSION=$(grep -E '^jac-version' jac.toml | sed -E 's/.*"==?([0-9.]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Testing on jac $VERSION"

      - name: Install jac
        run: |
          curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh \
            | bash -s -- --version "${{ steps.jac.outputs.version }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # The e2e fixture starts the server with this exact binary, so a dev
          # build on PATH can never silently take over the run.
          echo "JAC_BIN=$HOME/.local/bin/jac" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: jac install --dev

      - name: Install Playwright's browser
        run: jac -m playwright install --with-deps chromium

      # A type error does not stop the app from serving, so this is reported but
      # not gating -- the e2e suite below is the gate.
      - name: Type check
        continue-on-error: true
        run: jac check .

      - name: Run E2E tests
        # The fixture starts the server with this same binary (see conftest).
        run: jac -m pytest tests/e2e/ -v --timeout=300

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: .jac-e2e-server.log
          retention-days: 7
