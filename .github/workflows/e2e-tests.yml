name: JaSketch E2E Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Jac and dependencies
        run: pip install jaclang jac-client jac-scale pytest pytest-playwright pytest-timeout byllm jac-scale

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Install app dependencies
        run: jac install

      - name: Install local MCP server into jac venv
        run: .jac/venv/bin/pip install ./mcp-server --force-reinstall --no-deps

      - name: Run E2E tests
        run: jac start main.jac

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: tests/e2e/
          retention-days: 7
