name: Deploy JaSketch

# There is no image to build any more. jac-scale ships the source to the cluster
# on a PVC and the pods boot the pinned jac toolchain, so a deploy is one command
# and needs no registry, no Dockerfile, and no ECR credentials.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read the pinned jac version
        id: jac
        run: |
          VERSION=$(grep -E '^jac-version' jac.toml | sed -E 's/.*"==?([0-9.]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying on jac $VERSION"

      # Only the DRIVER needs this. The pods get their own copy of the pinned
      # release, shipped to them on the bundle PVC (see the deploy step).
      - name: Install jac
        run: |
          curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh \
            | bash -s -- --version "${{ steps.jac.outputs.version }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.2.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::776241927220:role/GitHubActionsSharedECRRole
          role-session-name: GitHubActions
          audience: sts.amazonaws.com

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region us-east-2

      # Catches HPA bounds, bad resource units and missing secrets in ~1s,
      # instead of after a rollout.
      - name: Lint the deploy plan
        run: jac start --scale --dry-run

      - name: Deploy
        run: jac start --scale
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}

      - name: Report status
        if: always()
        run: |
          {
            echo "## JaSketch deploy"
            echo "- **jac**: ${{ steps.jac.outputs.version }}"
            echo "- **result**: ${{ job.status }}"
            echo "- **URL**: https://jasketch.jaseci.org"
          } >> "$GITHUB_STEP_SUMMARY"
