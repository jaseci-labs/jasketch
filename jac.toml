[project]
name = "jasketch"
version = "2.0.0"
description = "JaSketch - a collaborative whiteboard built entirely in Jac"
entry-point = "main.jac"
kind = "web-app"
# The jac toolchain this app is built and deployed against. One pin resolves the
# pod binary, the admin console and the base image together; a pin that cannot be
# honored aborts the deploy instead of silently falling back to latest.
jac-version = "==0.34.14"

[dependencies]
# Relay/controller transport for the MCP bridge (mcp/server.jac connects to the
# app's /ws endpoint as a websockets client).
websockets = ">=12.0"
# Upper-bounded deliberately: mcp 2.0.0 renamed streamablehttp_client ->
# streamable_http_client, which is a hard ImportError in mcp/server.jac.
mcp = ">=1.0.0,<2.0.0"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"
"@tanstack/react-form" = "^1.33.0"
marked = "^12.0.0"

[dependencies.npm.dev]
tailwindcss = "latest"
"@tailwindcss/vite" = "latest"
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
# Browser driver for the end-to-end suite (tests/e2e). `jac install --dev` puts it
# in the binary's env; the browser itself comes from `jac -m playwright install chromium`.
playwright = ">=1.49.0"
pytest = ">=8.0.0"
pytest-playwright = ">=0.5.0"
pytest-timeout = ">=2.3.0"

[test]
directory = "tests"
verbose = true
fail_fast = false

[serve]
base_route_app = "app"

# byLLM ships inside the jac binary; the bare table declares the capability so
# `jac install` resolves litellm/pillow into .jac/venv. Model + key are supplied
# per request by the browser (agent/llm_factory.jac), not pinned here.
[byllm]

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "JaSketch"
description = "A collaborative whiteboard with an AI drawing agent, built in Jac."
icon = ".assets/icon.png"
author = "Jaseci"

[client.pwa]
theme_color = "#000000"
background_color = "#ffffff"

[scale.kubernetes]
app_name = "jasketch"
container_port = 8000
health_check_path = "/health"
min_replicas = 1
max_replicas = 3
cpu_request = "250m"
cpu_utilization_target = 70
memory_limit = "2Gi"
