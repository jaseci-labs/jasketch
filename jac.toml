[project]
name = "jasketch"
version = "1.0.0"
description = "Jac client application: jasketch"
entry-point = "main.jac"

[dependencies]
websockets = ">=12.0"
jasketch-mcp-server = ">=1.0.8"

[dependencies.npm]
tailwindcss = "latest"
"@tailwindcss/vite" = "latest"
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"
marked = "^12.0.0"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"
jac-scale = ">=0.2.14"

[serve]
base_route_app = "app"

[plugins.client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[plugins.scale.kubernetes]
mongodb_enabled = false   # Don't deploy MongoDB - use MONGODB_URI instead
redis_enabled = false     # Don't deploy Redis - use REDIS_URL instead

[plugins.scale.database]
mongodb_uri = "mongodb://localhost:27017"
redis_url = "redis://localhost:6379"

[plugins.client.app_meta_data]
title = "JaSketch"
icon = ".assets/icon.png"
author = "Jaseci"

[plugins.client.pwa]
theme_color = "#000000"
background_color = "#ffffff"
