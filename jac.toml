[project]
name = "jasketch"
version = "2.0.0"
description = "JaSketch - a collaborative whiteboard built entirely in Jac"
entry-point = "main.jac"
kind = "web-app"
# The jac toolchain this app is built and deployed against. One pin resolves the
# pod binary, the admin console and the base image together; a pin that cannot be
# honored aborts the deploy instead of silently falling back to latest.
jac-version = "==0.34.14"

[dependencies]
# Both are here for the MCP sub-project (mcp_server/), which shares this venv in
# development but declares its own dependencies for the published wheel.
websockets = ">=12.0"
# Upper-bounded deliberately: mcp 2.0.0 renamed streamablehttp_client ->
# streamable_http_client, which is a hard ImportError in the bridge.
mcp = ">=1.0.0,<2.0.0"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"
"@tanstack/react-form" = "^1.33.0"
marked = "^12.0.0"

[dependencies.npm.dev]
tailwindcss = "latest"
"@tailwindcss/vite" = "latest"
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
# Browser driver for the end-to-end suite (tests/e2e). `jac install --dev` puts it
# in the binary's env; the browser itself comes from `jac -m playwright install chromium`.
playwright = ">=1.49.0"
pytest = ">=8.0.0"
pytest-playwright = ">=0.5.0"
pytest-timeout = ">=2.3.0"

[test]
directory = "tests"
verbose = true
fail_fast = false

[serve]
base_route_app = "app"

# byLLM ships inside the jac binary; the bare table declares the capability so
# `jac install` resolves litellm/pillow into .jac/venv. Model + key are supplied
# per request by the browser (agent/llm_factory.jac), not pinned here.
[byllm]

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "JaSketch"
description = "A collaborative whiteboard with an AI drawing agent, built in Jac."
icon = ".assets/icon.png"
author = "Jaseci"

# NOTE: do NOT add [scale.secrets] MONGODB_URI/REDIS_URL "${VAR:-}" entries here.
# The deploy provisions its own MongoDB and Redis (mongodb_enabled /
# redis_enabled default to true) and injects their real URLs into the pods. A
# [scale.secrets] entry becomes a Kubernetes Secret that OVERRIDES that env, so
# interpolating an unset variable ships an EMPTY MONGODB_URI/REDIS_URL and the
# pod loses both databases. Observed: the websocket backplane then closes every
# connection with 4503 subscribe_unavailable.
#
# Same reason there is no [scale.websocket] redis_url: that value is resolved in
# the POD, not on the build host, so it would pin an empty string over the URL
# the deploy just injected. Unset means auto-detect, which is what we want.
#
# Set them only to attach to a database that lives somewhere else, and then set
# them to real values, never to an empty default.

# Declares the capabilities that put the CLIENT LIBRARIES in the pod. Without
# this the deploy still provisions MongoDB and Redis and still injects their
# URLs, so the runtime SELECTS them -- and then dies on a library that was never
# installed: "RedisBackplane selected but `redis` is not installed", and every
# websocket closes with 4503 subscribe_unavailable.
[scale.database]
backend = "mongo"   # data.mongo capability -> pymongo
type = "redis"      # data.redis capability -> redis

[scale.kubernetes]
# `jasketch.jaseci.org` runs in the `jasketch` namespace of the SHARED
# jaseci-cluster, so the default here is deliberately not that, and deliberately
# not `default` either (which is what an unset namespace silently means, and
# where a stray deploy would land among everyone else's work). CI and prod set
# K8S_NAMESPACE explicitly.
#
# Do not reach for `${VAR:?message}` to force it. That form IS implemented and
# raises when the variable is unset, but _interpolate_recursive catches the
# ValueError and returns the raw string, so the namespace becomes the literal
# `${K8S_NAMESPACE:?...}` and --dry-run still reports the plan as clean.
# jaseci-labs/jac#8773. Only `${VAR:-default}` is safe here.
namespace = "${K8S_NAMESPACE:-jasketch-dev}"
app_name = "${K8S_APP_NAME:-jasketch}"
container_port = 8000
# The deploy ships source + the pinned jac binary to pods on a ReadWriteMany
# bundle PVC. The usual cloud default StorageClass (EKS gp3 / ebs.csi) is
# ReadWriteOnce and cannot provision RWX, which leaves the bundle-loader pod
# Pending forever; pin the cluster's RWX class instead.
bundle_storage_class = "efs-sc"
health_check_path = "/health"
min_replicas = 1
max_replicas = 3
cpu_request = "250m"
cpu_utilization_target = 70
memory_limit = "2Gi"

# ── Ingress ───────────────────────────────────────────────────────────────────
# Joins the SHARED ALB (group.name) instead of provisioning a second load
# balancer -- the same group and certificate the existing jasketch.jaseci.org
# ingress uses. Each deploy sets K8S_INGRESS_HOST for its own hostname.
#
# The host deliberately defaults to the dev name rather than empty: an EMPTY
# host means match-any-host, and a match-any ingress joined to a shared ALB
# would swallow traffic meant for every other app on it. A wrong-but-specific
# hostname is inert; a wildcard is not.
#
# This lives at the top level because [environments.<name>.scale.*] profiles are
# silently ignored -- `--profile dev` produced an identical plan with no ingress,
# while the same block at the top level produced one. Checked on 0.34.14.
#
# Stickiness is copied from the existing ingress deliberately: without it the ALB
# can land successive requests from one browser on different replicas, breaking a
# websocket whose backplane subscription lives on another pod.
[scale.microservices.ingress]
enabled = true
host = "${K8S_INGRESS_HOST:-jasketch-dev.jaseci.org}"
ingress_class_name = "alb"

[scale.microservices.ingress.annotations]
"alb.ingress.kubernetes.io/group.name" = "jaseci-cluster-alb-2"
"alb.ingress.kubernetes.io/scheme" = "internet-facing"
"alb.ingress.kubernetes.io/target-type" = "ip"
"alb.ingress.kubernetes.io/listen-ports" = "[{\"HTTP\": 80}, {\"HTTPS\": 443}]"
"alb.ingress.kubernetes.io/ssl-redirect" = "443"
"alb.ingress.kubernetes.io/certificate-arn" = "arn:aws:acm:us-east-2:776241927220:certificate/642526d6-00ee-4394-970d-89d5dc898906"
"alb.ingress.kubernetes.io/target-group-attributes" = "stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400"
