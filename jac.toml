[project]
name = "jasketch"
version = "1.0.0"
description = "Jac client application: jasketch"
entry-point = "main.jac"

[dependencies.npm]
jac-client-node = "1.0.7"
tailwindcss = "latest"
"@tailwindcss/vite" = "latest"

[dependencies.npm.dev]
"@jac-client/dev-deps" = "2.0.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[dependencies]
websockets = ">=12.0"
litellm = ">=1.0.0"

[serve]
base_route_app = "app"

[plugins.client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[plugins.client.app_meta_data]
title = "JaSketch"
icon = ".assets/icon.png"
author = "Jaseci"

[plugins.client.pwa]
theme_color = "#000000"
background_color = "#ffffff"
